<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="./options.css" />
    </head>

    <body>
        <form class="options">
			<div class="options-div-toggle">
            	<p class="options-label">Toggle Grid</p>
				<p class="explaner">Assign a key binding to toggle the gridt while the popup window is closed. You can access the key binding for gridt by navigating to:<br/>Extensions > Keyboard shortcuts > gridt</p>
			</div>

			<hr class="options-hr">

			<div class="options-div-line">
				<div id="line-pref">
					<p class="options-label">Line preference</p>
					<p class="explaner">Choose a line stroke width and line color to customize gridt to your preferences.</p>
            	</div>

            	<input type="range" id="stroke-width" min="1" max="16">

				<label id="line-color" for="stroke-color">
					<div id="color-wrapper">
						<input type="color" id="stroke-color">
					</div>
					<div class="color-label">line color</div>
					<svg class="eyedropper" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="eyedropper"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>
				</label>
			</div>

			<hr class="options-hr">

			<button id="submit" type="submit">
				<div class="save-button">
					<svg class="floppy" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
					<p class="save-text">save</p>
				</div>
			</button>
        </form>

		<div id="gridt-preview">
			<svg xmlns="http://www.w3.org/2000/svg" aria-label="grid preview">
				<line x1="0" y1="10" x2="634" y2="10" />
				<line x1="0" y1="90" x2="634" y2="90" />
				<line x1="0" y1="170" x2="634" y2="170" />

				<line x1="320" y1="10" x2="320" y2="170" />
				<line x1="400" y1="10" x2="400" y2="170" />
				<line x1="480" y1="10" x2="480" y2="170" />
			</svg>
		</div>

        <script src="./main.js" type="text/javascript"></script>
    </body>
</html>
