<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="./options.css" />
    </head>

    <body>
        <form>
            <label for="grid-keybinding">Gridt Keybinding</label>
            <input type="text" id="grid-keybinding" value="Ctrl+Period" placeholder="Ctrl+Period">

            <label for="stroke-width">Stroke Width</label>
            <input type="text" id="stroke-width" value="1px" placeholder="1px">

            <label for="stroke-color">Stroke Color</label>
            <input type="text" id="stroke-color" value="blue" placeholder="blue">

            <button id="submit" type="submit">Save</button>
        </form>

        <script src="./main.js" type="text/javascript"></script>
    </body>
</html>
