<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" href="../../dist/popup/styles.css" />
    </head>

    <body>
        <div id="popup-content">
            <div id="settings">
                <div class="columns">
                    <label for="columns" id="columns-label">Columns:</label>
                    <input type="number" name="columns" id="columns" value="6" min="1" placeholder="6" title="grid-template-columns"></input>
                </div>

                <div class="rows">
                    <label for="rows" id="rows-label">Rows:</label>
                    <input type="number" name="rows" id="rows" value="8" min="1" placeholder="8" title="grid-template-rows"></input>
                </div>

                <div class="extra-columns">
                    <label for="extra-columns" id="extra-columns-label">Grid-template-columns:</label>
                    <input type="text" name="extra-columns" id="extra-columns" value="repeat(6, 1fr)" placeholder="repeat(6, 1fr)" title="grid.grid-template-columns"></input>
                </div>

                <div class="extra-rows">
                    <label for="extra-rows" id="extra-rows-label">Grid-template-rows:</label>
                    <input type="text" name="extra-rows" id="extra-rows" value="repeat(8, 1fr)" placeholder="repeat(8, 1fr)" title="grid.grid-template-rows"></input>
                </div>

                <div class="gap">
                    <label for="gaps" id="gaps-label">Gaps:</label>
                    <input type="text" name="gaps" id="gaps" value="20px" placeholder="20px" title="gap"></input>
                </div>

                <div id="standard-margins">
                    <label for="margin" id="margin-label">Outside Margin:</label>
                    <input type="text" name="margin" id="margin" value="15px" placeholder="15px" title="inset"></input>
                </div>

                <div id="extra-margins">
                    <label for="extra-top" id="extra-top-label">Top:</label>
                    <input type="text" name="extra-top" id="extra-top" value="15px" placeholder="15px" title="grid.top"></input>

                    <label for="extra-bottom" id="extra-bottom-label">Bottom:</label>
                    <input type="text" name="extra-bottom" id="extra-bottom" value="15px" placeholder="15px" title="grid.bottom"></input>

                    <label for="extra-left" id="extra-left-label">Left:</label>
                    <input type="text" name="extra-left" id="extra-left" value="15px" placeholder="15px" title="grid.left"></input>

                    <label for="extra-right" id="extra-right-label">Right:</label>
                    <input type="text" name="extra-right" id="extra-right" value="15px" placeholder="15px" title="grid.right"></input>
                </div>

                <div class="line-stroke">
                    <label for="extra-stroke" id="extra-stroke-label">Line Width:</label>
                    <input type="text" name="extra-stroke" id="extra-stroke" value="1px" placeholder="1px" title="line.width"></input>
                </div>

                <div class="line-color">
                    <label for="extra-color" id="extra-color-label">Line Color:</label>
                    <input type="text" name="extra-color" id="extra-color" value="blue" placeholder="blue" title="line.backgroundcolor"></input>
                </div>

                <div class="link-margins">
                    <input type="checkbox" id="extra-link-margins" name="extra-link-margins" checked/>
                    <label for="extra-link-margins" id="extra-link-margins-label">Link Margins</label>
                </div>

                <div class="keep-open">
                    <input type="checkbox" id="extra-keep-open" name="extra-keep-open"/>
                    <label for="extra-keep-open" id="extra-keep-open-label">Keep open onreload</label>
                </div>

                <div class="advanced">
                    <input type="checkbox" id="extra-options" name="extra-options"/>
                    <label for="extra-options" id="extra-label" title="Show extra options">Show Advanced Options</label>
                </div>

                <div class="attach">
                    <input type="checkbox" id="use-window" name="use-window" checked/>
                    <label for="use-window" id="use-window-label" title="attaches fixed to client window size">Attach to Window</label>
                    <input class="hidden" type="text" id="append-to-element" name="append-to-element" title="attaches absolute to an element" value="body"/>
                </div>
            </div>

            <button id="show-grid-button">Show Grid</button>
            <a id="error-content" class="vanish" href="https://github.com/gavink97/gridt/issues/new?"></a>

            <a class="kofi" href='https://ko-fi.com/E1E119NG8M'><img height='20' src='../../images/kofi_symbol.webp' alt='Buy Me a Coffee at ko-fi.com' /></a>
            <a class="logo" href="https://gav.ink">gav.ink</a>
        </div>
        <script src="../../dist/popup/popup.js" type="text/javascript"></script>
    </body>
</html>
